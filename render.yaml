databases:
  - name: deliveroo-db
    plan: free

services:
  - type: web
    name: deliveroo-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install pipenv && pipenv install --deploy --system
    startCommand: flask --app wsgi db upgrade && gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: deliveroo-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
