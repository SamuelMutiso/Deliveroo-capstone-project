name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install exactly what production installs
        run: pipenv sync --dev

      - name: Run the test suite
        run: pipenv run pytest tests -q
        env:
          SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
          JWT_SECRET_KEY: ci-jwt-key-not-used-outside-continuous-integration

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install pipenv
        run: pip install pipenv

      - run: pipenv sync

      - name: Upgrade an empty database from scratch
        run: pipenv run flask --app wsgi db upgrade
        env:
          SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
          JWT_SECRET_KEY: ci-jwt-key-not-used-outside-continuous-integration
          DATABASE_URL: sqlite:///ci.db
